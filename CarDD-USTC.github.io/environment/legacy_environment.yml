name: cardd_legacy
channels:
  - pytorch
  - defaults
dependencies:
  - python=3.8
  - pytorch=1.7.0
  - torchvision=0.8.1
  - torchaudio=0.7.0
  - cudatoolkit=11.0
  - pip
  - pip:
    - mmcv-full==1.7.0 -f https://download.openmmlab.com/mmcv/dist/cu110/torch1.7.0/index.html
    - mmdet==2.25.2
    - numpy
    - pycocotools
    - opencv-python
    - scipy
    - terminaltables
    - yapf
    - tensorboard
